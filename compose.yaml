# Local development and demo stack.
#
#   cp .env.example .env              # then set POSTGRES_PASSWORD (and ADMIN_API_KEY)
#   docker compose up -d --build      # database, migrations, API
#   docker compose --profile llm up -d          # + Ollama for local LLM and embeddings
#   docker compose --profile web up -d          # + nginx serving the Flutter web build
#
# Every port is bound to 127.0.0.1, so no service is reachable from other machines.

name: cti

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-Cyber Threat Intelligence API}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-}
  # Inside the Compose network the database host is the service name "db".
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cti}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cti}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
  # The "ollama" service from the llm profile; set OLLAMA_BASE_URL to use a host install.
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  NVD_API_KEY: ${NVD_API_KEY:-}
  OSV_ONLINE_LOOKUP: ${OSV_ONLINE_LOOKUP:-false}

services:
  db:
    # Official pgvector image: PostgreSQL 16 with pgvector 0.8.0.
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cti}
      POSTGRES_USER: ${POSTGRES_USER:-cti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: applies Alembic migrations (creates the vector extension on first run).
  migrate:
    build:
      context: ./backend
    image: cti-backend:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: cti-backend:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      # Google Gemini (optional). Only the API service receives the key; it is read
      # from .env and never baked into the image. Empty values disable Gemini.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  ollama:
    profiles: ["llm"]
    # Pinned for reproducibility; update to a current stable tag from
    # https://hub.docker.com/r/ollama/ollama/tags when you deploy.
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.5.7}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama

  web:
    profiles: ["web"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Build first: (cd frontend/flutter_app && flutter build web --release --no-web-resources-cdn)
    volumes:
      - ./frontend/flutter_app/build/web:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"

volumes:
  pgdata:
  ollama:
