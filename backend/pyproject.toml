[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-backend"
version = "0.1.0"
description = "Backend for the cybersecurity vulnerability discovery and threat-intelligence platform"
requires-python = ">=3.11"
# Compatible ranges; exact tested versions are pinned in constraints.txt.
dependencies = [
    "fastapi>=0.159,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic>=2.14,<3.0",
    "pydantic-settings>=2.16,<3.0",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3,<4.0",
    "alembic>=1.20,<2.0",
    "pgvector>=0.5,<0.6",
    "httpx>=0.28,<1.0",
    "packaging>=26.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running PostgreSQL (set TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.ruff.lint.isort]
# The local alembic/ migrations directory would otherwise make ruff treat the package as
# first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials in tests
"alembic/versions/**" = ["E501"]  # generated DDL strings

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
